name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: true }
      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Media tools for native scanner and playback tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Browser playback retry tests
        run: node scripts/test-playback-outbox.mjs
      - name: Vet & test
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o pocket-audiobooks ./cmd/pocket-audiobooks
      - name: Smoke test
        run: |
          DATA_DIR=/tmp/pab AUTH_MODE=none ./pocket-audiobooks &
          sleep 2
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/v1/dashboard | grep -q week_seconds
          curl -fsS http://localhost:8080/api/v1/home | grep -q libraries
          curl -fsS http://localhost:8080/api/v1/connection | grep -q '"backend":"native"'
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: pocket-audiobooks:pr
