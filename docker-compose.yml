# Standalone Pocket Audiobooks: Go, SQLite, React and local FFmpeg.
services:
  pocket-audiobooks:
    image: ghcr.io/abjelosevic88/pocket-homelab-audiobooks:latest
    container_name: pocket-audiobooks
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      MEDIA_BACKEND: native
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NOTIFY_URL: ${NOTIFY_URL:-}
      # SECURE_COOKIES: "true" # behind HTTPS
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
      - ${AUDIOBOOKS_DIR:-./audiobooks}:/audiobooks
    extra_hosts:
      - "host.docker.internal:host-gateway"
