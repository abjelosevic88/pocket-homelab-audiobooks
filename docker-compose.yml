# Pocket Audiobooks — audiobooks for the household on top of Audiobookshelf. Go + SQLite. One container, one volume.
services:
  pocket-audiobooks:
    image: ghcr.io/abjelosevic88/pocket-homelab-audiobooks:latest
    container_name: pocket-audiobooks
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # Your Audiobookshelf. Everyone connects their own account on it (Settings → Audiobookshelf).
      AUDIOBOOKSHELF_URL: ${AUDIOBOOKSHELF_URL:-http://audiobookshelf:80}
      AUDIOBOOKSHELF_PUBLIC_URL: ${AUDIOBOOKSHELF_PUBLIC_URL:-}
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # The admin's own Audiobookshelf account, copied once into their connection:
      # an API key made for that account, or a username + password.
      AUDIOBOOKSHELF_TOKEN: ${AUDIOBOOKSHELF_TOKEN:-}
      AUDIOBOOKSHELF_USER: ${AUDIOBOOKSHELF_USER:-}
      AUDIOBOOKSHELF_PASSWORD: ${AUDIOBOOKSHELF_PASSWORD:-}
      NOTIFY_URL: ${NOTIFY_URL:-}
      # Pocket Core: one sign-in, Audiobookshelf logins per person.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
